name: release-proof

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  production-like-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix shell/web ci
      - name: Static, dependency and secret gates
        run: |
          find shell/server build-worker ops -name '*.mjs' -print0 | xargs -0 -n1 node --check
          npm run security:secrets
          npm audit --omit=dev --audit-level=high
          npm --prefix shell/web audit --omit=dev --audit-level=high
      - name: Full unit and qualification suites
        run: |
          npm run test:code-agent
          npm run test:bv2:qualification
      - name: Browser matrix with installed engines
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e
      - name: Fresh Supabase reset, lint, diff and runtime proofs
        run: |
          npm exec -- supabase start
          npm run supabase:reset
          npm run supabase:lint
          npm exec -- supabase migration list --local
          npm exec -- supabase db diff --local --schema public > schema-diff.sql
          test ! -s schema-diff.sql
          set -a
          eval "$(npm exec -- supabase status -o env)"
          set +a
          BV2_GRAPH_PROOF=1 npm run supabase:graph:proof
          BV2_RUNTIME_PROOF=1 npm run supabase:runtime:proof
      - name: Worker image and sandbox proof
        run: |
          docker build --pull=false -t thrallo-build-sandbox:${GITHUB_SHA} -f build-worker/Dockerfile .
          THRALLO_BUILD_SANDBOX_IMAGE=thrallo-build-sandbox:${GITHUB_SHA} npm run worker:sandbox:proof
      - name: Backup compatibility and release artifacts
        run: |
          node --test test/code-agent/backup-coverage.test.mjs test/code-agent/restore-isolation.test.mjs
          npm run build:web
          mkdir -p .release
          git archive --format=tar HEAD | gzip -n > .release/source.tar.gz
          tar -C shell/web -czf .release/web.tar.gz dist
          tar -czf .release/shell.tar.gz shell/server shell/package.json
          docker save thrallo-build-sandbox:${GITHUB_SHA} | gzip -n > .release/worker-image.tar.gz
          node ops/create-local-migration-ledger.mjs .release/local-migration-ledger.json
          node ops/create-deployment-manifest.mjs \
            --output .release/DEPLOYMENT.json \
            --ledger .release/local-migration-ledger.json \
            --commit "$GITHUB_SHA" \
            --source-archive .release/source.tar.gz \
            --web-artifact .release/web.tar.gz \
            --shell-artifact .release/shell.tar.gz \
            --worker-artifact .release/worker-image.tar.gz
          THRALLO_SOURCE_ARCHIVE=.release/source.tar.gz \
          THRALLO_WEB_ARTIFACT=.release/web.tar.gz \
          THRALLO_SHELL_ARTIFACT=.release/shell.tar.gz \
          THRALLO_WORKER_ARTIFACT=.release/worker-image.tar.gz \
            npm run release:verify -- .release/DEPLOYMENT.json
          sha256sum .release/* > .release/SHA256SUMS
      - name: Local deploy smoke and provenance verification
        run: |
          THRALLO_DEPLOYMENT_MANIFEST=.release/DEPLOYMENT.json \
          CODE_AGENT_STANDALONE=on CODE_AGENT_STORE=memory PREVIEW_MODE=local \
            node shell/server/index.mjs > .release/shell-smoke.log 2>&1 & echo $! > .release/shell.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8788/api/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:8788/api/v1/capabilities > .release/capabilities.json
          kill $(cat .release/shell.pid)
          test -s .release/SHA256SUMS
      - name: Upload immutable release proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thrallo-release-${{ github.sha }}
          path: .release/
          if-no-files-found: error
          retention-days: 30
      - name: Stop disposable Supabase
        if: always()
        run: npm exec -- supabase stop --no-backup

# This workflow builds and proves artifacts only. It has no production credentials and no deploy
# step, so a release proof cannot mutate production.
