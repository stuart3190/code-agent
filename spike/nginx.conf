events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS resolver — required for per-request hostname resolution
    # when proxy_pass uses a variable (which enables dynamic container routing).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Extract the first subdomain label from the Host header.
    # e.g. "spike-proj-1.51.195.136.189.nip.io" -> "spike-proj-1"
    # Docker DNS resolves this name to the container IP on the shared network.
    map $http_host $proj_name {
        ~^([^.]+)\.  $1;
        default      "";
    }

    server {
        listen 80 default_server;

        # Health check for the orchestration layer (Phase 4)
        location = /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://$proj_name:5173;
            proxy_http_version 1.1;

            # WebSocket upgrade forwarding — required for Vite HMR.
            # Without these, nginx drops the Upgrade header and the WS handshake fails.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Vite 5 requires Sec-WebSocket-Protocol: vite-hmr — without it, Vite silently
            # ignores the upgrade request and never sends a 101 response.
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # HMR keeps a persistent WS connection; 86400s = 24h without timeout.
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 10s;
        }
    }
}
